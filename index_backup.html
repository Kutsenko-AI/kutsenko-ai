<script id="living-cosmos-script">
(()=>{'use strict';
const canvas=document.getElementById('livingCosmos');
if(!canvas||!canvas.getContext)return;
const ctx=canvas.getContext('2d',{alpha:true});
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
let w=0,h=0,dpr=1,stars=[],dust=[],comets=[],raf=0,last=0,nextComet=0;
const rnd=(a,b)=>a+Math.random()*(b-a);
const colors=['#5ceaff','#8e7dff','#d7eaff','#65a4ff','#d4a3ff'];
function resize(){
 dpr=Math.min(devicePixelRatio||1,1.5);
 w=window.innerWidth;h=window.innerHeight;
 canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
 stars=Array.from({length:Math.min(115,Math.max(35,Math.floor(w*h/9500)))},()=>({
 x:rnd(0,w),y:rnd(0,h),r:rnd(.35,1.55),phase:rnd(0,7),speed:rnd(.3,1.3),color:colors[Math.floor(rnd(0,colors.length))]
 }));
 dust=Array.from({length:Math.min(24,Math.max(10,Math.floor(w*h/28000)))},()=>({
 x:rnd(0,w),y:rnd(0,h),r:rnd(1,2.8),speed:rnd(.09,.32),phase:rnd(0,7)
 }));
}
function spawn(){
 const fromTop=Math.random()<.7;
 const x=fromTop?rnd(-w*.2,w*.95):rnd(-w*.25,-30);
 const y=fromTop?rnd(-50,h*.24):rnd(0,h*.65);
 const speed=rnd(3.5,7.8);
 const angle=rnd(.28,.75);
 comets.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
 length:rnd(65,155),life:0,max:rnd(65,135),width:rnd(.8,1.8),
 color:colors[Math.floor(rnd(0,colors.length))]});
 if(comets.length>3)comets.shift();
}
function frame(t){
 raf=0;
 if(document.hidden||reduced.matches||document.body.classList.contains('no-motion'))return;
 const dt=Math.min((t-last||16)/16.67,2);last=t;
 ctx.clearRect(0,0,w,h);
 for(const st of stars){
  const a=.18+.55*(.5+.5*Math.sin(t*.001*st.speed+st.phase));
  ctx.globalAlpha=a;ctx.fillStyle=st.color;
  ctx.beginPath();ctx.arc(st.x,st.y,st.r,0,Math.PI*2);ctx.fill();
 }
 for(const p of dust){
  p.y-=p.speed*dt;p.x+=Math.sin(t*.00035+p.phase)*.12*dt;
  if(p.y< -8){p.y=h+8;p.x=rnd(0,w)}
  ctx.globalAlpha=.16;ctx.fillStyle='#85aaff';
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;
 if(t>nextComet){spawn();nextComet=t+rnd(1800,4600)}
 for(let i=comets.length-1;i>=0;i--){
  const c=comets[i];c.x+=c.vx*dt;c.y+=c.vy*dt;c.life+=dt;
  const fade=Math.min(1,c.life/12,(c.max-c.life)/20);
  if(fade<=0||c.x>w+200||c.y>h+200){comets.splice(i,1);continue}
  const tailX=c.x-c.vx/c.vy*c.length*Math.sin(Math.atan2(c.vy,c.vx));
  const tailY=c.y-c.length*Math.sin(Math.atan2(c.vy,c.vx));
  const grad=ctx.createLinearGradient(c.x,c.y,tailX,tailY);
  grad.addColorStop(0,'rgba(210,245,255,'+(.85*fade)+')');
  grad.addColorStop(.16,'rgba(91,214,255,'+(.55*fade)+')');
  grad.addColorStop(1,'rgba(116,87,255,0)');
  ctx.strokeStyle=grad;ctx.lineWidth=c.width*2.2;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(c.x,c.y);ctx.lineTo(tailX,tailY);ctx.stroke();
  ctx.fillStyle='rgba(223,250,255,'+fade+')';
  ctx.shadowBlur=12;ctx.shadowColor=c.color;
  ctx.beginPath();ctx.arc(c.x,c.y,c.width*1.2,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
 }
 raf=requestAnimationFrame(frame);
}
function start(){if(!raf&&!document.hidden&&!reduced.matches&&!document.body.classList.contains('no-motion')){last=0;raf=requestAnimationFrame(frame)}}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;ctx.clearRect(0,0,w,h)}
resize();start();
window.addEventListener('resize',()=>{resize();start()},{passive:true});
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());
reduced.addEventListener('change',()=>reduced.matches?stop():start());
const observer=new MutationObserver(()=>document.body.classList.contains('no-motion')?stop():start());
observer.observe(document.body,{attributes:true,attributeFilter:['class']});
})();
</script>
<script id="cosmic-menu-script">
(()=>{'use strict';
const el=document.getElementById('drawer'),canvas=document.getElementById('drawerCosmos');
if(!el||!canvas)return;
const ctx=canvas.getContext('2d');if(!ctx)return;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let w=0,h=0,stars=[],comets=[],raf=0,last=0,next=0;
const rand=(a,b)=>a+Math.random()*(b-a);
function resize(){
 const d=Math.min(devicePixelRatio||1,1.5);
 w=el.clientWidth;h=Math.max(el.scrollHeight,innerHeight);
 canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);
 canvas.style.height=h+'px';ctx.setTransform(d,0,0,d,0,0);
 stars=Array.from({length:Math.min(95,Math.max(45,Math.floor(w*h/5600)))},()=>({
 x:rand(0,w),y:rand(0,h),r:rand(.4,1.5),phase:rand(0,6.28),speed:rand(.4,1.8)
 }));
}
function meteor(){
 const x=rand(-w*.5,w*.85),y=rand(-20,h*.65),v=rand(2.8,6.5),len=rand(35,95);
 comets.push({x,y,vx:v,vy:v*rand(.3,.75),len,age:0,max:rand(42,105)});
 if(comets.length>3)comets.shift();
}
function draw(t){
 raf=0;
 if(!el.classList.contains('open')||document.hidden||reduced.matches)return;
 const dt=Math.min((t-last||16)/16.67,2);last=t;
 ctx.clearRect(0,0,w,h);
 const glow=ctx.createRadialGradient(w*.72,h*.2,0,w*.72,h*.2,w*.85);
 glow.addColorStop(0,'rgba(61,50,178,.18)');glow.addColorStop(1,'rgba(61,50,178,0)');
 ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);
 for(const p of stars){
 ctx.globalAlpha=.16+.58*(.5+.5*Math.sin(t*.001*p.speed+p.phase));
 ctx.fillStyle=p.phase>3?'#9c88ff':'#75eaff';
 ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;
 if(t>next){meteor();next=t+rand(1900,4400)}
 for(let i=comets.length-1;i>=0;i--){
 const c=comets[i];c.x+=c.vx*dt;c.y+=c.vy*dt;c.age+=dt;
 if(c.age>c.max||c.x>w+120||c.y>h+120){comets.splice(i,1);continue}
 const a=Math.max(0,Math.min(1,c.age/10,(c.max-c.age)/16));
 const mag=Math.hypot(c.vx,c.vy);
 const x2=c.x-c.vx/mag*c.len,y2=c.y-c.vy/mag*c.len;
 const g=ctx.createLinearGradient(c.x,c.y,x2,y2);
 g.addColorStop(0,'rgba(223,250,255,'+a+')');
 g.addColorStop(.2,'rgba(72,209,255,'+(.65*a)+')');
 g.addColorStop(1,'rgba(148,80,255,0)');
 ctx.strokeStyle=g;ctx.lineWidth=2;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(c.x,c.y);ctx.lineTo(x2,y2);ctx.stroke();
 ctx.fillStyle='rgba(230,250,255,'+a+')';ctx.beginPath();ctx.arc(c.x,c.y,1.7,0,Math.PI*2);ctx.fill();
 }
 raf=requestAnimationFrame(draw);
}
function start(){if(!raf&&el.classList.contains('open')&&!document.hidden&&!reduced.matches){last=0;raf=requestAnimationFrame(draw)}}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;ctx.clearRect(0,0,w,h)}
const observer=new MutationObserver(()=>{if(el.classList.contains('open')){resize();start()}else stop()});
observer.observe(el,{attributes:true,attributeFilter:['class']});
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());
window.addEventListener('resize',()=>{resize();start()},{passive:true});
reduced.addEventListener('change',()=>reduced.matches?stop():start());
resize();start();
})();
</script>

function positions(){const planets=nodes.filter(n=>n.kind==='planet'),stars=nodes.filter(n=>n.kind==='star');const points=new Map();const cx=w/2,cy=h*.48;const rad=Math.min(w*.32,h*.32,190);
planets.forEach((n,i)=>{const a=i*2.39996-.8;const r=planets.length===1?0:Math.min(rad,50+Math.sqrt(i/Math.max(1,planets.length-1))*rad*.8);points.set(n.id,{x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r,r:Math.max(15,24-Math.floor(planets.length/7))})});

for(let i=0;i<115;i++){const x=((i*127.7+13)%997)/997*w,y=((i*331.1+79)%991)/991*h;ctx.globalAlpha=.18+.55*(.5+.5*Math.sin(time*.0008+i*3));ctx.fillStyle=i%4?'#a1d9ff':'#bd9dff';ctx.beginPath();ctx.arc(x,y,i%9===0?1.4:.65,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;

for(const n of nodes){const p=points.get(n.id);if(!p)continue;const active=selected===n.id;ctx.save();ctx.shadowColor=n.kind==='planet'?'#47d9ff':'#e2a7ff';ctx.shadowBlur=active?26:14;
if(n.kind==='planet'){const g=ctx.createRadialGradient(p.x-p.r*.3,p.y-p.r*.4,2,p.x,p.y,p.r);g.addColorStop(0,'#c7faff');g.addColorStop(.38,'#41bde9');g.addColorStop(.78,'#544ac5');g.addColorStop(1,'#24134e');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r+(active?3:0),0,Math.PI*2);ctx.fill();ctx.strokeStyle='#a0bfff80';ctx.beginPath();ctx.ellipse(p.x,p.y,p.r*1.45,p.r*.38,-.4,0,Math.PI*2);ctx.stroke()}
else{ctx.fillStyle='#f5d7ff';ctx.beginPath();ctx.arc(p.x,p.y,active?7:4.5,0,Math.PI*2);ctx.fill()}ctx.restore();ctx.fillStyle='#e6f8ff';ctx.font='12px system-ui';ctx.textAlign='center';ctx.shadowBlur=4;ctx.shadowColor='#020716';const label=n.name.length>19?n.name.slice(0,18)+'…':n.name;ctx.fillText(label,p.x,Math.min(h-6,p.y+p.r+19));ctx.shadowBlur=0}

function heading(title){panel.replaceChildren();panel.classList.add('visible');const line=document.createElement('div');line.className='g65-topline';const h3=document.createElement('h3');h3.textContent=title;const x=document.createElement('button');x.className='g65-btn';x.textContent='✕';x.onclick=closePanel;line.append(h3,x);panel.append(line)}

function edit(kind,id){const d=dict(),n=nodes.find(x=>x.id===id);heading(n?n.name:(kind==='planet'?d.newproject:d.newidea));const name=field(d.name),desc=field(d.details,'textarea');if(n){name.value=n.name;desc.value=n.desc||''}let parent=null;if(kind==='star'){const label=document.createElement('label');label.textContent=d.parent;panel.append(label);parent=document.createElement('select');const none=document.createElement('option');none.value='';none.textContent=d.none;parent.append(none);for(const p of nodes.filter(x=>x.kind==='planet')){const op=document.createElement('option');op.value=p.id;op.textContent=p.name;parent.append(op)}parent.value=n?.parent||'';panel.append(parent)}
const actions=document.createElement('div');actions.className='g65-actions';panel.append(actions);button(d.save,()=>{const title=name.value.trim();if(!title){name.focus();return}if(n){n.name=title;n.desc=desc.value.trim();if(parent)n.parent=parent.value}else nodes.push({id:'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),kind,name:title,desc:desc.value.trim(),parent:parent?.value||''});save();closePanel();draw()},actions);button(d.cancel,closePanel,actions)}

canvas.addEventListener('click',e=>{const b=canvas.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top,points=positions();let match=null,best=Infinity;for(const n of nodes){const p=points.get(n.id);if(!p)continue;const dist=Math.hypot(x-p.x,y-p.y);if(dist<p.r+14&&dist<best){match=n;best=dist}}if(match)details(match);else closePanel()});

})();

<script id="black-universe7-script">
(()=>{'use strict';
const canvas=document.getElementById('cosmicFX7'),ctx=canvas.getContext('2d');
const scene=document.getElementById('sceneFX7');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let w=0,h=0,dpr=1,planets=[],rockets=[],stars=[],last=0,nextRocket=0,frameId=0,sceneTimer=0;
const rnd=(a,b)=>a+Math.random()*(b-a);
function resize(){
 w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,1.5);
 canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
 stars=Array.from({length:Math.min(135,Math.floor(w*h/6200)+45)},()=>({x:rnd(0,w),y:rnd(0,h),r:rnd(.35,1.65),phase:rnd(0,6),v:rnd(.4,1.7)}));
 planets=Array.from({length:Math.min(4,Math.max(2,Math.floor(w/180)))},(_,i)=>({x:rnd(0,w),y:(i+.45)*h/4,r:rnd(8,23),hue:[220,275,190,330][i],phase:rnd(0,6)}));
}
function spawnRocket(){
 rockets.push({x:-75,y:rnd(65,h*.85),speed:rnd(1.5,3.1),angle:rnd(-.25,.25),scale:rnd(.65,1.1)});
 if(rockets.length>2)rockets.shift();
}
function draw(t){
 frameId=0;if(document.hidden||reduced.matches||document.body.classList.contains('no-motion'))return;
 const dt=Math.min(2,(t-last||16)/16.67);last=t;ctx.clearRect(0,0,w,h);
 for(const p of stars){
 ctx.globalAlpha=.15+.8*(.5+.5*Math.sin(t*.001*p.v+p.phase));
 ctx.fillStyle=p.phase>3?'#aa8fff':'#c0f8ff';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;
 for(const p of planets){
 const x=p.x+Math.sin(t*.00012+p.phase)*13,y=p.y+Math.cos(t*.00015+p.phase)*9;
 const g=ctx.createRadialGradient(x-p.r*.32,y-p.r*.35,1,x,y,p.r*1.4);
 g.addColorStop(0,'hsla('+p.hue+',95%,80%,.52)');g.addColorStop(.4,'hsla('+p.hue+',85%,40%,.35)');g.addColorStop(1,'hsla('+p.hue+',85%,20%,0)');
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,p.r*1.5,0,Math.PI*2);ctx.fill();

 }
 if(t>nextRocket){spawnRocket();nextRocket=t+rnd(8500,15000)}
 for(let i=rockets.length-1;i>=0;i--){
 const r=rockets[i];r.x+=r.speed*dt;r.y+=r.angle*dt;
 if(r.x>w+100){rockets.splice(i,1);continue}
 ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.angle);ctx.scale(r.scale,r.scale);
 const trail=ctx.createLinearGradient(-55,0,0,0);trail.addColorStop(0,'#9258ff00');trail.addColorStop(1,'#48dfffaa');
 ctx.strokeStyle=trail;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-55,0);ctx.lineTo(-9,0);ctx.stroke();
 ctx.fillStyle='#c1ecff';ctx.beginPath();ctx.moveTo(15,0);ctx.lineTo(-12,-6);ctx.lineTo(-9,0);ctx.lineTo(-12,6);ctx.closePath();ctx.fill();
 ctx.fillStyle='#816dff';ctx.beginPath();ctx.arc(0,0,3,0,Math.PI*2);ctx.fill();ctx.restore();
 }

}
function start(){if(!frameId&&!document.hidden&&!reduced.matches&&!document.body.classList.contains('no-motion')){last=0;frameId=requestAnimationFrame(draw)}}

function showScene(kind){
 if(reduced.matches||document.body.classList.contains('no-motion'))return;

 science:{icons:['⚛️','🧬','🔬','🧪','🔭','🛰️'],label:'SCIENCE LAB'},
 ideas:{icons:['💡','✨','🧠','🪐'],label:'IDEA UNIVERSE'},
 code:{icons:['💻','⌨️','⚙️','🔣'],label:'CODE SPACE'},
 space:{icons:['🚀','🪐','🌠','🛸'],label:'COSMIC EXPLORATION'},

 };
 const data=modes[kind];if(!data)return;
 clearTimeout(sceneTimer);scene.replaceChildren();
 const label=document.createElement('div');label.className='sceneLabel';label.textContent=data.label;scene.append(label);
 const orbit=document.createElement('div');orbit.className='orbit7';scene.append(orbit);
 for(let i=0;i<9;i++){
  const item=document.createElement('span');item.className='float7';item.textContent=data.icons[i%data.icons.length];
  item.style.setProperty('--y',rnd(12,83)+'%');item.style.setProperty('--dur',rnd(3.2,6.4)+'s');
  item.style.animationDelay=(-rnd(0,3))+'s';scene.append(item);
 }

}
document.addEventListener('click',e=>{
 const target=e.target.closest('button');if(!target)return;
 const id=target.id||'';
 if(id==='sideSettings')showScene('languages');
 else if(id==='sideGalaxy')showScene('galaxy');
 else if(id==='sideProjects')showScene('ideas');
 else if(id==='sidePlugins')showScene('code');
 else if(id==='sideSchedule')showScene('space');
 else if(target.classList.contains('suggestion')){
 const q=(target.dataset.q||'').toLowerCase();
 if(q.includes('квант')||q.includes('наук'))showScene('science');
 else if(q.includes('проект')||q.includes('иде'))showScene('ideas');
 else if(q.includes('python')||q.includes('код'))showScene('code');
 else if(q.includes('космос'))showScene('space');
 }
},true);

})();

(()=>{

<script id="beyond-reality-rings">
(()=>{
 const portal=document.getElementById('cosmic10Overlay');
 const wrap=portal?.querySelector('.cosmic10-planet-wrap');
 if(!wrap)return;
 const canvases=['ringParticlesBack','ringParticlesFront'].map(id=>{const c=document.createElement('canvas');c.id=id;c.setAttribute('aria-hidden','true');wrap.appendChild(c);return c});
 let running=false,frame=0;
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 function render(time){
  if(!portal.classList.contains('visible') && getComputedStyle(portal).display==='none'){running=false;return}
  const width=wrap.clientWidth*1.24,height=wrap.clientHeight*1.24;
  const dpr=Math.min(devicePixelRatio||1,1.5);
  canvases.forEach((canvas,side)=>{
   const w=Math.round(width*dpr),h=Math.round(height*dpr);
   if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}
   const ctx=canvas.getContext('2d');if(!ctx)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);
   const cx=width/2,cy=height/2, tilt=-.39,ct=Math.cos(tilt),st=Math.sin(tilt);
   const tick=(reduced?0:time*.00015);
   for(let layer=0;layer<7;layer++){
    const rx=width*(.36+layer*.019),ry=height*(.10+layer*.006);
    const count=90;
    for(let i=0;i<count;i++){
     const angle=i/count*Math.PI*2+tick*(1.1-layer*.07);
     const x=rx*Math.cos(angle),y=ry*Math.sin(angle);
     const yy=x*st+y*ct;
     if((yy>=0?1:0)!==side)continue;
     const xx=x*ct-y*st;
     const a=.15+.55*(.5+.5*Math.sin(angle*7+layer));
     ctx.beginPath();ctx.fillStyle=`rgba(${layer%3===0?'246,211,166':layer%3===1?'192,148,255':'142,202,255'},${a})`;
     ctx.shadowBlur=layer%3===0?5:9;ctx.shadowColor=layer%3===0?'#ffd3a0':'#a784ff';
     ctx.arc(cx+xx,cy+yy,layer%2===0?.75:1.15,0,Math.PI*2);ctx.fill();
    }
   }
   ctx.shadowBlur=0;
  });
  frame=requestAnimationFrame(render);
 }
 const observer=new MutationObserver(()=>{const visible=getComputedStyle(portal).display!=='none';if(visible&&!running){running=true;frame=requestAnimationFrame(render)}else if(!visible&&running){cancelAnimationFrame(frame);running=false}});
 observer.observe(portal,{attributes:true,attributeFilter:['class','style']});
 document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(frame);running=false}else if(getComputedStyle(portal).display!=='none'&&!running){running=true;frame=requestAnimationFrame(render)}});
})();
</script>
