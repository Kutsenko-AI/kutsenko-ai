rflow:ellipsis;white-space:nowrap;font-size:12px;padding:8px 13px;background:#0b1729;border-radius:99px;color:#a3b6cf}.tab.active{background:#153554;border-color:#3ec5e9;color:#b9f5ff;box-shadow:inset 0 0 12px #11b9ef17}.note{font-size:11px;text-align:center;color:#6e8da8;padding:5px 12px;letter-spacing:.2px}.messages{flex:1;min-height:42vh;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding:24px max(18px,calc((100% - 790px)/2)) 30px;scrollbar-width:thin}.msg{position:relative;max-width:92%;line-height:1.68;overflow-wrap:anywhere;font-size:14px}.msg.user{align-self:flex-end;padding:13px 17px;border:1px solid #3068a2;background:linear-gradient(135deg,#153b6b,#122a50);border-radius:17px 17px 5px 17px;box-shadow:0 8px 25px #02081255;white-space:pre-wrap}.msg.assistant{align-self:flex-start;width:fit-content;max-width:100%;padding:16px 18px 12px;border:1px solid #233b55;background:linear-gradient(145deg,#0d1c2f,#0b1627);border-radius:5px 18px 18px 18px;box-shadow:0 8px 35px #0004}.msg.assistant:before{content:'✦ KUTSENKO AI';display:block;font-size:10px;letter-spacing:1.5px;font-weight:800;color:#51dcf7;margin-bottom:10px}.msg.assistant h2,.msg.assistant h3,.msg.assistant h4{color:#d9faff;margin:15px 0 7px;line-height:1.35}.msg.assistant h2{font-size:18px}.msg.assistant h3{font-size:16px}.msg.assistant h4{font-size:15px}.msg.assistant p{margin:8px 0}.msg.assistant ul,.msg.assistant ol{padding-left:23px;margin:9px 0}.msg.assistant li{margin:6px 0}.msg.assistant strong{color:#fff}.msg.assistant pre{overflow:auto;background:#050e1c;border:1px solid #243e60;border-radius:12px;padding:13px}.msg.assistant code{background:#152940;border-radius:5px;padding:2px 5px;font-size:13px}.msg.assistant pre code{background:transparent;padding:0}.msg.assistant blockquote{border-left:3px solid #39dbf7;padding:5px 12px;margin:10px 0;color:#b1c7df}.msg.assistant hr{border:0;border-top:1px solid #2b435e;margin:16px 0}.copy-answer{display:block;margin-top:13px;padding:7px 11px;background:#0c253a;border:1px solid #2b5c7c;color:#9ceeff;border-radius:9px;font-size:12px}.composer-wrap{position:sticky;bottom:0;padding:15px 16px max(16px,env(safe-area-inset-bottom));background:linear-gradient(0deg,#050b17 75%,#050b17e0);border-top:1px solid #1c304777}.composer{max-width:800px;margin:auto;display:flex;align-items:flex-end;gap:10px;background:#0c1b30;border:1px solid #2a5071;border-radius:20px;padding:8px 8px 8px 15px;box-shadow:0 0 28px #04b5ed0b}.composer:focus-within{border-color:#39c9ef;box-shadow:0 0 0 2px #16bff01b}.composer textarea{min-height:40px;max-height:150px;resize:vertical;flex:1;border:0;outline:0;background:transparent;color:#f1f9ff;padding:10px 0;line-height:1.5;font-size:14px}.composer textarea::placeholder{color:#8199b6}.send{height:43px;width:46px;border:0;border-radius:13px;background:linear-gradient(135deg,#24d7ef,#3878ff);color:#061323;font-size:23px;font-weight:800;box-shadow:0 0 18px #18bce85c}.send:disabled{opacity:.5}.footer-note{text-align:center;color:#607993;font-size:10px;margin:10px 0 0}.welcome .messages{justify-content:center;align-items:center}.welcome .msg.assistant{max-width:520px;width:100%;background:linear-gradient(145deg,#0e2138,#0a1628);border-color:#2d5a79;box-shadow:0 0 70px #008cff15}.welcome .msg.assistant:before{font-size:12px}a{color:#69e5ff}@media(min-width:760px){header{padding:22px 28px}.controls{padding:16px 28px 10px}.chats{padding-left:28px;padding-right:28px}.messages{padding-top:35px}}@media(max-width:420px){h1{font-size:15px}.sub{font-size:10px}.logo{height:38px;width:38px}.controls{padding:11px 12px 7px}.chats{padding:2px 12px 10px}.messages{padding:16px 12px 24px}.msg.assistant{padding:13px}.composer-wrap{padding:10px 10px max(12px,env(safe-area-inset-bottom))}}
</style></head>
<body><div class="app"><header><div class="brand"><div class="logo">✦</div><div><h1>KUTSENKO <span style="color:#49e3ff">AI</span></h1><div class="sub"><span class="online"></span>FUTURE EDITION · AI ASSISTANT</div></div></div><button class="ghost" id="export" title="Скачать историю чатов">⇩ Экспорт</button></header>
<div class="controls"><select id="mode" aria-label="Режим"><option value="chat">✦ Общение</option><option value="math">∑ Математика</option><option value="science">⚛ Наука</option><option value="code">⌘ Код</option><option value="writing">✎ Тексты</option></select><button id="new">＋ Новый чат</button><button id="remove" class="ghost" title="Удалить чат">♲</button></div><nav class="chats" id="tabs" aria-label="История чатов"></nav><div class="note" id="status">KUTSENKO AI · Gemini через Cloudflare</div><main class="messages" id="messages"></main><div class="composer-wrap"><form class="composer" id="form"><textarea id="prompt" placeholder="Спроси KUTSENKO AI о чём угодно…" rows="1" required aria-label="Сообщение"></textarea><button class="send" type="submit" aria-label="Отправить">➤</button></form><div class="footer-note">KUTSENKO AI может ошибаться. Проверяйте важную информацию.</div></div></div>
<script>
const KEY='kutsenko_mobile_v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!data||!Array.isArray(data.chats)||!data.chats.length)data={active:0,chats:[{title:'Первый чат',messages:[{role:'assistant',text:'Привет! Я KUTSENKO AI. Задай мне вопрос — я постараюсь помочь.'}]}]};const $=id=>document.getElementById(id);const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const current=()=>data.chats[data.active];function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function inlineMarkdown(s){
 let v=escapeHTML(s);
 v=v.replace(/`([^`]+)`/g,'<code>$1</code>');
 v=v.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
 v=v.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g,'<em>$1</em>');
 return v;
}
function markdownHTML(src){
 const lines=String(src).replace(/\r/g,'').split('\n');let html='',list='',fence=false,code=[];
 const close=()=>{if(list){html+='</'+list+'>';list=''}};
 for(const line of lines){
  if(/^\s*```/.test(line)){close();if(fence){html+='<pre><code>'+escapeHTML(code.join('\n'))+'</code></pre>';code=[];fence=false}else fence=true;continue}
  if(fence){code.push(line);continue}
  if(!line.trim()){close();continue}
  const h=line.match(/^\s*(#{1,4})\s+(.+)$/);
  if(h){close();const n=Math.min(3,h[1].length+1);html+='<h'+n+'>'+inlineMarkdown(h[2])+'</h'+n+'>';continue}
  if(/^\s*---+\s*$/.test(line)){close();html+='<hr>';continue}
  const bullet=line.match(/^\s*[-*+]\s+(.+)$/),num=line.match(/^\s*\d+[.)]\s+(.+)$/);
  if(bullet||num){const kind=bullet?'ul':'ol';if(list!==kind){close();list=kind;html+='<'+kind+'>'}html+='<li>'+inlineMarkdown((bullet||num)[1])+'</li>';continue}
  close();if(/^\s*>\s?/.test(line))html+='<blockquote>'+inlineMarkdown(line.replace(/^\s*>\s?/,''))+'</blockquote>';else html+='<p>'+inlineMarkdown(line)+'</p>';
 }
 close();if(fence)html+='<pre><code>'+escapeHTML(code.join('\n'))+'</code></pre>';return html;
}
function render(){if(data.active>=data.chats.length)data.active=0;$('tabs').replaceChildren();data.chats.forEach((c,i)=>{let b=document.createElement('button');b.className='tab'+(i===data.active?' active':'');b.textContent=c.title;b.onclick=()=>{data.active=i;save();render()};$('tabs').append(b)});$('messages').replaceChildren();document.body.classList.toggle('welcome',current().messages.length===0||(current().messages.length===1&&current().messages[0].role==='assistant'&&/Привет|Новый диалог/.test(current().messages[0].text)));current().messages.forEach(m=>{let d=document.createElement('div');d.className='msg '+m.role;if(m.role==='assistant'){
 d.innerHTML=markdownHTML(m.text);
 if(m.text!=='Думаю…'){
  const copy=document.createElement('button');copy.type='button';copy.className='copy-answer';copy.textContent='📋 Копировать';
  copy.onclick=async()=>{try{await navigator.clipboard.writeText(m.text);copy.textContent='✓ Скопировано'}catch(e){copy.textContent='Не удалось скопировать'}};
  d.append(copy);
 }
 }else d.textContent=m.text;$('messages').append(d)});$('messages').scrollTop=$('messages').scrollHeight;save()}
function isPrime(n){if(!Number.isSafeInteger(n)||n<2)return false;for(let d=2;d*d<=n;d++)if(n%d===0)return false;return true}
function answer(text){let s=text.trim();let prime=s.match(/(?:прост(?:ое|ым|ым ли)?\s*(?:число)?\s*|проверь\s+(?:число\s*)?)(\d{1,15})/i);if(prime){let n=Number(prime[1]);return Number.isSafeInteger(n)?`${n} — ${isPrime(n)?'простое':'составное'} число.`:'Число слишком велико для безопасной проверки в этой версии.'}let expr=s.replace(/^(?:посчитай|вычисли|сколько будет|calculate)\s*/i,'').replace(/,/g,'.').replace(/\s/g,'');if(/^[\d.+\-*/()%]+$/.test(expr)&&/[+*/%-]/.test(expr)&&expr.length<120){try{let toks=expr.match(/\d+(?:\.\d+)?|[()+*/%-]/g);if(toks&&toks.join('')===expr){let i=0;function factor(){if(toks[i]==='+'||toks[i]==='-'){let sign=toks[i++];return (sign==='-'?-1:1)*factor()}if(toks[i]==='('){i++;let v=sum();if(toks[i++]!==')')throw Error();return v}let v=Number(toks[i++]);if(!Number.isFinite(v))throw Error();return v}function prod(){let v=factor();while(['*','/','%'].includes(toks[i])){let op=toks[i++],r=factor();v=op==='*'?v*r:op==='/'?v/r:v%r}return v}function sum(){let v=prod();while(['+','-'].includes(toks[i])){let op=toks[i++],r=prod();v=op==='+'?v+r:v-r}return v}let v=sum();if(i!==toks.length||!Number.isFinite(v))throw Error();return 'Результат: '+v}}catch(e){return 'Не удалось вычислить выражение. Проверь скобки и операции.'}}return 'Я получил сообщение, но сейчас работаю без подключённой языковой модели. Могу проверить простое число (например: «проверь 313») или вычислить выражение (например: «(12+8)*3»). Для свободного общения следующим этапом подключим безопасный ИИ-сервер.'}
const API_URL='https://kutsenko-ai-api.87054235572toxa.workers.dev/chat';
$('status').textContent='ИИ-чат через Gemini • требуется интернет';
let sending=false;
$('form').onsubmit=async e=>{
 e.preventDefault();if(sending)return;
 const t=$('prompt').value.trim();if(!t)return;
 const chat=current();chat.messages.push({role:'user',text:t});
 if(chat.messages.filter(m=>m.role==='user').length===1)chat.title=t.slice(0,22);
 const reply={role:'assistant',text:'Думаю…'};chat.messages.push(reply);
 $('prompt').value='';sending=true;$('form').querySelector('button[type="submit"]').disabled=true;render();
 try{
  const messages=chat.messages.filter(m=>m!==reply).filter(m=>m.role==='user'||m.role==='assistant').slice(-10).map(m=>({role:m.role==='assistant'?'model':'user',text:m.text}));
  const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages})});
  const result=await response.json();
  if(!response.ok)throw Error(result.error||'Ошибка сервера '+response.status);
  reply.text=(result.answer||'').trim()||'Модель не вернула текст. Попробуй ещё раз.';
 }catch(err){reply.text='Не удалось получить ответ ИИ. Проверь интернет и настройки сервера. ('+err.message+')'}
 finally{sending=false;$('form').querySelector('button[type="submit"]').disabled=false;save();render()}
};$('new').onclick=()=>{data.chats.push({title:'Новый чат',messages:[{role:'assistant',text:'Новый диалог создан. Что проверим?'}]});data.active=data.chats.length-1;render()};$('remove').onclick=()=>{if(!confirm('Удалить текущий чат?'))return;data.chats.splice(data.active,1);if(!data.chats.length)data.chats.push({title:'Новый чат',messages:[]});data.active=0;render()};$('export').onclick=()=>{let a=document.createElement('a'),blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='kutsenko_chats.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};if('serviceWorker'in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});}render();
</script></body></html>
