<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1222"><link rel="manifest" href="manifest.webmanifest"><title>KUTSENKO AI</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1222;color:#f3f6ff;font:15px system-ui,-apple-system,sans-serif}.app{max-width:850px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}header{padding:18px 16px;border-bottom:1px solid #28344f;display:flex;justify-content:space-between;align-items:center}h1{font-size:19px;margin:0}.sub{font-size:11px;color:#94a4c5}button,select,input,textarea{font:inherit}button,select{background:#223456;color:white;border:1px solid #34496c;border-radius:12px;padding:10px}button{cursor:pointer}.controls{display:flex;gap:8px;padding:10px;flex-wrap:wrap}.controls select{flex:1;min-width:130px}.controls button{white-space:nowrap}.chats{display:flex;gap:6px;overflow-x:auto;padding:0 10px 10px}.tab{white-space:nowrap;background:#17243d;font-size:13px}.tab.active{background:#365bc0}.messages{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:45vh}.msg{padding:12px 14px;max-width:90%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45;border-radius:15px}.user{background:#3154aa;align-self:flex-end}.assistant{background:#1b2a44;align-self:flex-start}.note{color:#a8b6d0;font-size:12px;text-align:center;padding:4px 16px}.composer{padding:12px;display:flex;gap:8px;border-top:1px solid #28344f;position:sticky;bottom:0;background:#0c1222}textarea{resize:none;min-height:46px;max-height:160px;flex:1;border-radius:12px;background:#15233b;border:1px solid #34496c;color:#fff;padding:12px}.send{background:#3a66dc}.small{font-size:12px}a{color:#afc8ff}</style></head><body><div class="app"><header><div><h1>✦ KUTSENKO AI</h1><div class="sub">Mobile • универсальный помощник</div></div><button id="export">Экспорт</button></header><div class="controls"><select id="mode"><option value="chat">💬 Общение</option><option value="math">🧮 Математика</option><option value="science">🔬 Наука</option><option value="code">💻 Код</option><option value="writing">✍️ Тексты</option></select><button id="new">+ Новый чат</button><button id="remove" title="Удалить текущий чат">🗑</button></div><div class="chats" id="tabs"></div><div class="note" id="status">Локальная версия: общие ИИ-ответы пока не подключены</div><main class="messages" id="messages"></main><form class="composer" id="form"><textarea id="prompt" placeholder="Напиши сообщение..." rows="2" required></textarea><button class="send" type="submit">➤</button></form></div><script>
const KEY='kutsenko_mobile_v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!data||!Array.isArray(data.chats)||!data.chats.length)data={active:0,chats:[{title:'Первый чат',messages:[{role:'assistant',text:'Привет! Я KUTSENKO AI. Сейчас я работаю в локальном режиме: могу проверить простое число и вычислить простые математические выражения. Для полноценного ИИ-чата потребуется подключение к серверу модели.'}]}]};const $=id=>document.getElementById(id);const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const current=()=>data.chats[data.active];function render(){if(data.active>=data.chats.length)data.active=0;$('tabs').replaceChildren();data.chats.forEach((c,i)=>{let b=document.createElement('button');b.className='tab'+(i===data.active?' active':'');b.textContent=c.title;b.onclick=()=>{data.active=i;save();render()};$('tabs').append(b)});$('messages').replaceChildren();current().messages.forEach(m=>{let d=document.createElement('div');d.className='msg '+m.role;d.textContent=m.text;$('messages').append(d)});$('messages').scrollTop=$('messages').scrollHeight;save()}
function isPrime(n){if(!Number.isSafeInteger(n)||n<2)return false;for(let d=2;d*d<=n;d++)if(n%d===0)return false;return true}
function answer(text){let s=text.trim();let prime=s.match(/(?:прост(?:ое|ым|ым ли)?\s*(?:число)?\s*|проверь\s+(?:число\s*)?)(\d{1,15})/i);if(prime){let n=Number(prime[1]);return Number.isSafeInteger(n)?`${n} — ${isPrime(n)?'простое':'составное'} число.`:'Число слишком велико для безопасной проверки в этой версии.'}let expr=s.replace(/^(?:посчитай|вычисли|сколько будет|calculate)\s*/i,'').replace(/,/g,'.').replace(/\s/g,'');if(/^[\d.+\-*/()%]+$/.test(expr)&&/[+*/%-]/.test(expr)&&expr.length<120){try{let toks=expr.match(/\d+(?:\.\d+)?|[()+*/%-]/g);if(toks&&toks.join('')===expr){let i=0;function factor(){if(toks[i]==='+'||toks[i]==='-'){let sign=toks[i++];return (sign==='-'?-1:1)*factor()}if(toks[i]==='('){i++;let v=sum();if(toks[i++]!==')')throw Error();return v}let v=Number(toks[i++]);if(!Number.isFinite(v))throw Error();return v}function prod(){let v=factor();while(['*','/','%'].includes(toks[i])){let op=toks[i++],r=factor();v=op==='*'?v*r:op==='/'?v/r:v%r}return v}function sum(){let v=prod();while(['+','-'].includes(toks[i])){let op=toks[i++],r=prod();v=op==='+'?v+r:v-r}return v}let v=sum();if(i!==toks.length||!Number.isFinite(v))throw Error();return 'Результат: '+v}}catch(e){return 'Не удалось вычислить выражение. Проверь скобки и операции.'}}return 'Я получил сообщение, но сейчас работаю без подключённой языковой модели. Могу проверить простое число (например: «проверь 313») или вычислить выражение (например: «(12+8)*3»). Для свободного общения следующим этапом подключим безопасный ИИ-сервер.'}
$('form').onsubmit=e=>{e.preventDefault();let t=$('prompt').value.trim();if(!t)return;let c=current();c.messages.push({role:'user',text:t});if(c.messages.filter(m=>m.role==='user').length===1)c.title=t.slice(0,22);c.messages.push({role:'assistant',text:answer(t)});$('prompt').value='';render()};$('new').onclick=()=>{data.chats.push({title:'Новый чат',messages:[{role:'assistant',text:'Новый диалог создан. Что проверим?'}]});data.active=data.chats.length-1;render()};$('remove').onclick=()=>{if(!confirm('Удалить текущий чат?'))return;data.chats.splice(data.active,1);if(!data.chats.length)data.chats.push({title:'Новый чат',messages:[]});data.active=0;render()};$('export').onclick=()=>{let a=document.createElement('a'),blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='kutsenko_chats.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
